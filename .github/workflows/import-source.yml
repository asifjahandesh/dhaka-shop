name: Import DHAKA SHOP source
on:
  push:
    branches: [main]
    paths:
      - ".dhaka-shop-bootstrap.tar.xz.b64"
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Import prepared application source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .dhaka-shop-bootstrap.tar.xz.b64 > /tmp/dhaka-shop-source.tar.xz
          mkdir -p /tmp/dhaka-shop-source
          tar -xJf /tmp/dhaka-shop-source.tar.xz -C /tmp/dhaka-shop-source
          cp -a /tmp/dhaka-shop-source/. .
          rm .dhaka-shop-bootstrap.tar.xz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add DHAKA SHOP Next.js application source"
          git push
